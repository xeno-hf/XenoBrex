connect.title=连接 ECU（实时调校）
connect.detail=电脑先连上 ECU 的 WiFi。连上之后会把 ECU 上的整份调校读回来（约一两分钟），跟目前开着的文件比对，并把 ECU 原值备份起来。\n\n之后在这里改表，停手约半秒就会写进 ECU 并读回确认。写的是 ECU 的内存，马上生效；关电门时 ECU 通常会自己存下来，但不保证。改坏了用备份还原。\n\n有准星的表（例如主燃油表）会实时标出引擎目前的位置。
