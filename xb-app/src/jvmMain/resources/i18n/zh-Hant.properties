ecu.err.restoreDrift=還原未確認：最後整份讀回有 {0} 張表跟備份不同。
ecu.err.recovery={0}失敗：{1}。已中斷 ECU 連線並捨棄快取。調校前請重新連線完整讀回；需要時還原已驗證的備份：{2}
msg.restoredRows=還原驗證完成：{0} 張表已還原，{1} 張原本一致，{2} 張 ECU 拒絕的表維持原值。
