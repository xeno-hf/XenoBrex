# ECU 備份驗證與復原
ecu.readOnly=ECU 唯讀
ecu.recovery=ECU 需要復原
ecu.editingFrozen=ECU 作業中，暫停編輯。
ecu.err.compatibility=已停用 ECU 寫入：{0}
ecu.err.incomplete=ECU 讀回不完整（{0} 張表讀不到），已停用寫入與還原。請重新連線讀回。
ecu.err.backup=ECU 備份未能儲存並驗證：{0}。連線維持唯讀。
ecu.err.connectionChanged=ECU 連線已改變。請重新連線並完成備份驗證後再寫入。
ecu.err.verifyFull=完整驗證失敗：{0} 張表讀不到，{1} 張表不一致。
ecu.err.restoreOriginal=請選擇這次連線已驗證的備份；其他調校檔不能用來還原本次連線。
