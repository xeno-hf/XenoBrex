connect.title=Connect ECU (live tuning)
connect.detail=Connect this computer to the ECU's WiFi first. After connecting, the whole calibration is read from the ECU (a minute or two), compared with the open file, and the ECU's values are backed up.\n\nEdits made here are written to the ECU about half a second after you stop, then read back to confirm. They go to the ECU's memory and take effect at once; the ECU usually keeps them at key-off, but this is not guaranteed. Use the backup to restore if something goes wrong.\n\nTables with a cursor (such as the main fuel table) mark where the engine is right now.
