connect.failed=Not connected
differs.title=The ECU's values differ from the file
differs.detail={0} tables differ ({1} cells in total). Live tuning needs both sides to match first:\n  · Use the ECU's values: the editor switches to what is on the ECU (save the file separately).\n  · Write the file to the ECU: write the current file's values.
