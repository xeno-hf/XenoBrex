writing.progress=Writing to the ECU: {0} / {1} blocks. Do not turn the key off or start the engine.
flash.checklist=Before writing, check that:\n  · the engine is off (do not write while running or riding);\n  · the key is on and the battery voltage is good;\n  · writing takes about a minute; do not turn the key off or drop the WiFi.\nIf writing is interrupted, the ECU's calibration may be incomplete; write again or restore from a backup.
